<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex">
  <title>Centrála | ISB7 CORE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: #0c0c0f;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --line: #27272a;
      --red: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 Arial, Helvetica, sans-serif;
    }
    .shell {
      width: min(100%, 72rem);
      margin-inline: auto;
      padding: max(22px, env(safe-area-inset-top)) max(clamp(14px, 4vw, 46px), env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(clamp(14px, 4vw, 46px), env(safe-area-inset-left));
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
      font: 11px/1.4 var(--mono);
      letter-spacing: .13em;
    }
    .signature, .back { display: flex; align-items: center; gap: 10px; }
    .signature { font-weight: 700; letter-spacing: .23em; }
    .mark {
      position: relative;
      flex: none;
      width: 23px;
      height: 42px;
      overflow: hidden;
      mix-blend-mode: screen;
    }
    .mark img {
      position: absolute;
      width: 92px;
      height: 92px;
      max-width: none;
      left: -5.7px;
      top: -25px;
      filter: contrast(1.27);
    }
    .accent { color: var(--red); }
    .back {
      min-height: 44px;
      padding-inline: 8px;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--text); }
    main {
      margin-top: clamp(22px, 5vw, 56px);
      padding: clamp(18px, 5vw, 60px);
      border: 1px solid var(--line);
      background: var(--panel);
    }
    h1 {
      margin: 0 0 clamp(24px, 5vw, 46px);
      font-size: clamp(38px, 8vw, 86px);
      font-weight: 750;
      line-height: 1;
      letter-spacing: -.075em;
    }
    .modules {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 0;
    }
    .module {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 88px;
      height: 100%;
      padding: clamp(12px, 2.5vw, 22px);
      border: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }
    a.module { border-left: 2px solid #753439; }
    a.module:hover, a.module:focus-visible { background: #171012; border-color: #8c4146; }
    a:focus-visible { outline: 1px solid var(--red); outline-offset: 3px; }
    .module-name { display: block; font-size: clamp(17px, 2.5vw, 23px); font-weight: 650; line-height: 1.2; }
    .module-info, .module-state { color: var(--muted); font: 11px/1.45 var(--mono); }
    .module-info { display: block; margin-top: 6px; }
    .module-state { text-align: right; }
    .module-arrow {
      position: relative;
      flex: 0 0 10px;
      height: 10px;
      border-top: 1px solid var(--red);
      border-right: 1px solid var(--red);
    }
    .module-arrow::before {
      content: "";
      position: absolute;
      top: -1px;
      right: -1px;
      width: 13px;
      height: 1px;
      background: var(--red);
      transform: rotate(-45deg);
      transform-origin: right center;
    }
    @media (max-width: 610px) {
      .modules { grid-template-columns: 1fr; }
      .module { min-height: 74px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="signature">
        <span class="mark" aria-hidden="true"><img src="/assets/isb7-brand.png" alt="" width="92" height="92"></span>
        <span>ISB7 <span class="accent">/</span> CORE</span>
      </div>
      <a class="back" href="/"><span class="accent" aria-hidden="true">←</span> Zpět na ISB7 CORE</a>
    </header>
    <main>
      <h1>Centrála</h1>
      <nav aria-label="Moduly ISB7">
        <ul class="modules">
          <li>
            <div class="module">
              <span><span class="module-name">ISB7notes</span><span class="module-info">Poznámky a úkoly</span></span>
              <span class="module-state">Odkaz nenastaven</span>
            </div>
          </li>
          <li>
            <a class="module" href="https://isb7-garmin.trustworthybuckle16.chatgpt.site/">
              <span><span class="module-name">ISB7 Data Link</span><span class="module-info">Denní přehled Garminu</span></span>
              <span class="module-arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="module" href="https://isb7cz.github.io/f1/">
              <span><span class="module-name">F1 víkend</span><span class="module-info">Program závodního víkendu</span></span>
              <span class="module-arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a class="module" href="https://strihnuto.cz/">
              <span><span class="module-name">STŘIHNUTO</span><span class="module-info">Mobilní kadeřnictví</span></span>
              <span class="module-arrow" aria-hidden="true"></span>
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </div>
</body>
</html>
